<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Simulator - Premium Edition</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Libraries -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #e0e6ed;
            --accent-color: #7289da;
            --accent-hover: #5b6eae;
            --input-bg: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1a1d2e 0%, #0b0d17 100%);
        }

        h1,
        h2,
        h3,
        h4,
        h5 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        /* Layout */
        .main-container {
            display: flex;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }

        .sidebar {
            width: 400px;
            background: rgba(11, 13, 23, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.3);
        }

        .map-container {
            flex-grow: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Form Elements */
        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #a0aec0;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            padding: 0.75rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(114, 137, 218, 0.2);
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), #5b6eae);
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            margin-top: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(114, 137, 218, 0.4);
            background: linear-gradient(135deg, #8ea1e6, #677bc4);
        }

        /* Results Card */
        .result-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 2rem;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.5s ease-out;
        }

        .moon-phase-display {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .moon-emoji {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .data-label {
            color: #a0aec0;
        }

        .data-value {
            font-weight: 600;
            color: #fff;
        }

        /* Bookmarks */
        .bookmark-list {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
        }

        .bookmark-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .bookmark-item:last-child {
            border-bottom: none;
        }

        .bookmark-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .bookmark-name {
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .bookmark-delete {
            color: #ff6b6b;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .bookmark-delete:hover {
            background: rgba(255, 107, 107, 0.2);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0b0d17;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a5568;
        }

        /* Leaflet Customization */
        .leaflet-popup-content-wrapper {
            background: rgba(11, 13, 23, 0.9);
            backdrop-filter: blur(5px);
            color: white;
            border-radius: 8px;
        }

        .leaflet-popup-tip {
            background: rgba(11, 13, 23, 0.9);
        }

        .moon-icon {
            font-size: 24px;
            text-align: center;
            line-height: 24px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 50%;
                order: 2;
            }

            .map-container {
                height: 50%;
                order: 1;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 class="mb-4 text-center">Moon Simulator</h2>

            <form id="location-form">
                <div class="mb-3">
                    <label for="lat" class="form-label">위도 (Latitude)</label>
                    <input type="number" step="any" class="form-control" id="lat" placeholder="37.5665" value="37.5665"
                        required>
                </div>
                <div class="mb-3">
                    <label for="lon" class="form-label">경도 (Longitude)</label>
                    <input type="number" step="any" class="form-control" id="lon" placeholder="126.9780"
                        value="126.9780" required>
                </div>
                <div class="mb-3">
                    <label for="elevation" class="form-label">고도 (Elevation, m)</label>
                    <input type="number" class="form-control" id="elevation" placeholder="0" value="0">
                </div>
                <div class="mb-3">
                    <label for="date" class="form-label">날짜 (Date)</label>
                    <input type="date" class="form-control" id="date" required>
                </div>
                <div class="mb-3">
                    <label for="duration" class="form-label">시간 범위 (Duration, hours)</label>
                    <input type="number" class="form-control" id="duration" placeholder="8" value="8" min="1" max="24">
                </div>

                <button type="submit" class="btn btn-primary">
                    <span id="btn-text">계산하기 (Calculate)</span>
                    <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"
                        aria-hidden="true"></span>
                </button>
            </form>

            <!-- Bookmarks Section -->
            <div class="mt-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h4 class="m-0" style="font-size: 1.1rem;">북마크 (Bookmarks)</h4>
                    <button class="btn btn-sm btn-outline-light" onclick="saveBookmark()" style="font-size: 0.8rem;">
                        + 저장
                    </button>
                </div>
                <ul id="bookmark-list" class="bookmark-list">
                    <!-- Bookmarks will be loaded here -->
                    <li class="p-3 text-center text-muted" style="font-size: 0.85rem;">저장된 위치가 없습니다.</li>
                </ul>
            </div>

            <div id="result"></div>
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();

        // Load Bookmarks on Startup
        loadBookmarks();

        function saveBookmark() {
            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;

            if (!lat || !lon) {
                alert("위도와 경도를 입력해주세요.");
                return;
            }

            const name = prompt("이 위치의 이름을 입력하세요:", `위치 ${lat}, ${lon}`);
            if (!name) return;

            const bookmark = { name, lat, lon };
            let bookmarks = JSON.parse(localStorage.getItem('moonSim_bookmarks')) || [];
            bookmarks.push(bookmark);
            localStorage.setItem('moonSim_bookmarks', JSON.stringify(bookmarks));

            loadBookmarks();
        }

        function loadBookmarks() {
            const listEl = document.getElementById('bookmark-list');
            const bookmarks = JSON.parse(localStorage.getItem('moonSim_bookmarks')) || [];

            if (bookmarks.length === 0) {
                listEl.innerHTML = '<li class="p-3 text-center text-muted" style="font-size: 0.85rem;">저장된 위치가 없습니다.</li>';
                return;
            }

            listEl.innerHTML = '';
            bookmarks.forEach((bm, index) => {
                const li = document.createElement('li');
                li.className = 'bookmark-item';
                li.onclick = () => loadBookmark(index);
                li.innerHTML = `
                <span class="bookmark-name">${bm.name}</span>
                <span class="bookmark-delete" onclick="deleteBookmark(event, ${index})">×</span>
            `;
                listEl.appendChild(li);
            });
        }

        function loadBookmark(index) {
            const bookmarks = JSON.parse(localStorage.getItem('moonSim_bookmarks')) || [];
            const bm = bookmarks[index];
            if (bm) {
                document.getElementById('lat').value = bm.lat;
                document.getElementById('lon').value = bm.lon;
                map.setView([bm.lat, bm.lon], 12);
            }
        }

        function deleteBookmark(event, index) {
            event.stopPropagation(); // Prevent triggering loadBookmark
            if (!confirm("정말 삭제하시겠습니까?")) return;

            let bookmarks = JSON.parse(localStorage.getItem('moonSim_bookmarks')) || [];
            bookmarks.splice(index, 1);
            localStorage.setItem('moonSim_bookmarks', JSON.stringify(bookmarks));
            loadBookmarks();
        }

        // Initialize Map (Dark Mode)
        var map = L.map('map').setView([37.5665, 126.9780], 10);

        // CartoDB Dark Matter Tile Layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        var layers = L.layerGroup().addTo(map);
        var rightClickMarker;

        // Right click to pick location
        map.on('contextmenu', function (e) {
            var lat = e.latlng.lat.toFixed(6);
            var lon = e.latlng.lng.toFixed(6);

            document.getElementById('lat').value = lat;
            document.getElementById('lon').value = lon;

            if (rightClickMarker) {
                map.removeLayer(rightClickMarker);
            }

            var customIcon = L.divIcon({
                html: '📍',
                className: 'moon-icon',
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });

            rightClickMarker = L.marker(e.latlng, { icon: customIcon }).addTo(map)
                .bindPopup(`<b>선택된 위치</b><br>위도: ${lat}<br>경도: ${lon}`)
                .openPopup();
        });

        let altitudeChart = null;

        document.getElementById('location-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const resultDiv = document.getElementById('result');

            // Loading State
            btnText.textContent = '계산 중...';
            btnSpinner.classList.remove('d-none');

            if (rightClickMarker) {
                map.removeLayer(rightClickMarker);
            }
            layers.clearLayers();

            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;
            const date = document.getElementById('date').value;
            const elevation = document.getElementById('elevation').value;
            const duration = document.getElementById('duration').value;

            fetch('/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat, lon, date, elevation, duration }),
            })
                .then(response => response.json())
                .then(data => {
                    // Reset Button
                    btnText.textContent = '계산하기 (Calculate)';
                    btnSpinner.classList.add('d-none');

                    if (data.error) {
                        resultDiv.innerHTML = `<div class="alert alert-warning mt-3">${data.error}</div>`;
                        return;
                    }

                    const location = data.location;
                    map.setView([location.lat, location.lon], 12);

                    // Build Result HTML
                    let resultHtml = `<div class="result-card">`;

                    if (data.moon_phase) {
                        // Dynamic SVG Moon Phase
                        const phaseAngle = data.moon_phase.phase_angle || 0;
                        const illumination = data.moon_phase.illumination;

                        const getPhaseEmoji = (d) => {
                            if (d < 10 || d > 350) return '🌑';
                            if (d < 80) return '🌒';
                            if (d < 100) return '🌓';
                            if (d < 170) return '🌔';
                            if (d < 190) return '🌕';
                            if (d < 260) return '🌖';
                            if (d < 280) return '🌗';
                            return '🌘';
                        }

                        resultHtml += `
                    <div class="moon-phase-display">
                        <div class="moon-emoji">${getPhaseEmoji(phaseAngle)}</div>
                        <div>
                            <h5 class="m-0">${data.moon_phase.name_korean}</h5>
                            <small class="text-muted">밝기: ${illumination.toFixed(1)}% (위상각: ${phaseAngle.toFixed(1)}°)</small>
                        </div>
                    </div>
                `;
                    }

                    resultHtml += `<div class="mt-3">`;
                    if (data.moonrise_time_kst) {
                        resultHtml += `
                    <div class="data-row">
                        <span class="data-label">월출 (Moonrise)</span>
                        <span class="data-value">${data.moonrise_time_kst.split(' ')[1]}</span>
                    </div>
                    <div class="data-row mb-3">
                        <span class="data-label">방위각 (Azimuth)</span>
                        <span class="data-value">${data.moonrise_azimuth.toFixed(1)}°</span>
                    </div>
                `;
                    }

                    if (data.moonset_time_kst) {
                        resultHtml += `
                    <div class="data-row">
                        <span class="data-label">월몰 (Moonset)</span>
                        <span class="data-value">${data.moonset_time_kst.split(' ')[1]}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">방위각 (Azimuth)</span>
                        <span class="data-value">${data.moonset_azimuth.toFixed(1)}°</span>
                    </div>
                `;
                    }

                    if (!data.moonrise_time_kst && !data.moonset_time_kst) {
                        resultHtml += `<p class="text-center text-muted">해당 날짜에 월출/월몰 정보가 없습니다.</p>`;
                    }

                    // Recommendation Section
                    if (data.recommendation) {
                        resultHtml += `
                            <div class="mt-3 p-3" style="background: rgba(114, 137, 218, 0.1); border-radius: 8px; border: 1px solid var(--accent-color);">
                                <h6 class="text-white mb-2">📸 추천 관측 시간 (Best Time)</h6>
                                <p class="mb-0 text-light" style="font-size: 0.9rem;">${data.recommendation}</p>
                            </div>
                        `;
                    }

                    // Chart Section
                    resultHtml += `
                        <div class="mt-4">
                            <h6 class="text-white mb-3">달 고도 변화 (Altitude)</h6>
                            <canvas id="altitudeChart" width="100%" height="200"></canvas>
                        </div>
                    `;

                    resultHtml += `</div></div>`;

                    resultDiv.innerHTML = resultHtml;

                    // Render Chart
                    if (data.hourly_positions && document.getElementById('altitudeChart')) {
                        const ctx = document.getElementById('altitudeChart').getContext('2d');

                        // Destroy previous chart if exists
                        if (altitudeChart) {
                            altitudeChart.destroy();
                        }

                        const labels = data.hourly_positions.map(p => p.time);
                        const altitudes = data.hourly_positions.map(p => p.altitude);

                        altitudeChart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: '고도 (Altitude)',
                                    data: altitudes,
                                    borderColor: '#7289da',
                                    backgroundColor: 'rgba(114, 137, 218, 0.2)',
                                    borderWidth: 2,
                                    fill: true,
                                    tension: 0.4
                                }]
                            },
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: { display: false }
                                },
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                                        ticks: { color: '#a0aec0' }
                                    },
                                    x: {
                                        grid: { display: false },
                                        ticks: { color: '#a0aec0' }
                                    }
                                }
                            }
                        });
                    }

                    // Map Markers
                    const userIcon = L.divIcon({
                        html: '🏠',
                        className: 'moon-icon',
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    L.marker([location.lat, location.lon], { icon: userIcon })
                        .addTo(layers)
                        .bindPopup("<b>현재 위치</b>")
                        .openPopup();

                    if (data.hourly_positions) {
                        data.hourly_positions.forEach((pos, i) => {
                            const isVisible = pos.altitude > 0;
                            const line_color = isVisible ? (i === 0 ? "#ff9f43" : "#feca57") : "#576574";
                            const line_weight = isVisible ? (i === 0 ? 4 : 2) : 1;
                            const line_opacity = isVisible ? 1.0 : 0.4;

                            // 1. Visible Line
                            L.polyline(
                                [[location.lat, location.lon], [pos.dest_lat, pos.dest_lon]],
                                {
                                    color: line_color,
                                    weight: line_weight,
                                    opacity: line_opacity,
                                    dashArray: isVisible ? null : '5, 5',
                                    interactive: false
                                }
                            ).addTo(layers);

                            // 2. Invisible Hit-Area Line (Buffer)
                            L.polyline(
                                [[location.lat, location.lon], [pos.dest_lat, pos.dest_lon]],
                                {
                                    color: 'transparent',
                                    weight: 20,
                                    opacity: 0,
                                    interactive: true
                                }
                            ).addTo(layers)
                                .bindTooltip(`
                        <div style="text-align:center;">
                            <b>${pos.time}</b><br>
                            Az: ${pos.azimuth.toFixed(1)}°<br>
                            Alt: ${pos.altitude.toFixed(1)}°
                        </div>
                    `, { direction: 'top', sticky: true });

                            const moonEmoji = isVisible ? '🌕' : '🌑';
                            const iconOpacity = isVisible ? 1.0 : 0.5;

                            var moonIcon = L.divIcon({
                                html: `<span style="opacity: ${iconOpacity}; font-size: 20px;">${moonEmoji}</span>`,
                                className: 'moon-icon',
                                iconSize: [20, 20],
                                iconAnchor: [10, 10]
                            });
                            L.marker([pos.dest_lat, pos.dest_lon], { icon: moonIcon }).addTo(layers);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    btnText.textContent = '계산하기 (Calculate)';
                    btnSpinner.classList.add('d-none');
                    resultDiv.innerHTML = `<div class="alert alert-danger mt-3">오류가 발생했습니다.</div>`;
                });
        });
    </script>

</body>

</html>
